<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">MathMerit contribution profile</title>
<desc id="chart-description">Five dimensions with their own named ordinal grades, from top clockwise: Significance, Knowledge, Understanding, Methods, Exposition. Lowest grades share the origin; three rings represent the higher grades. Unfilled template; deliver only with five supported grades. A complete profile may degenerate to a point or lines.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #243748; text-anchor: middle; }
.axis-name { font-size: 24px; font-weight: 600; }
.grade-name { font-size: 18px; fill: #176373; }
</style>
<rect width="1400" height="980" fill="#ffffff"/>
<text id="profile-title" x="700" y="42" font-size="26" font-weight="600">Mathematical contribution profile</text>
<g id="grid" fill="none" stroke="#cbd5e1" stroke-width="1.2">
<polygon data-radius="86.666666667" points="700.000,363.333 782.425,423.219 750.941,520.115 649.059,520.115 617.575,423.219"/>
<polygon data-radius="173.333333333" points="700.000,276.667 864.850,396.437 801.883,590.230 598.117,590.230 535.150,396.437"/>
<polygon data-radius="260.000000000" points="700.000,190.000 947.275,369.656 852.824,660.344 547.176,660.344 452.725,369.656"/>
<line x1="700" y1="450" x2="700.000" y2="190.000"/>
<line x1="700" y1="450" x2="947.275" y2="369.656"/>
<line x1="700" y1="450" x2="852.824" y2="660.344"/>
<line x1="700" y1="450" x2="547.176" y2="660.344"/>
<line x1="700" y1="450" x2="452.725" y2="369.656"/>
</g>
<g id="profile-area" fill="#176373" fill-opacity="0.20" stroke="#176373" stroke-width="2.5" stroke-linejoin="round">
<polygon id="profile-contour" points="" visibility="hidden"/>
</g>
<g id="grade-positions" fill="#ffffff" stroke="#b6c6d5" stroke-width="1.2">
<circle id="grade-origin" cx="700" cy="450" r="3"/>
<circle cx="700.000" cy="363.333" r="3"/>
<circle cx="700.000" cy="276.667" r="3"/>
<circle cx="700.000" cy="190.000" r="3"/>
<circle cx="782.425" cy="423.219" r="3"/>
<circle cx="864.850" cy="396.437" r="3"/>
<circle cx="947.275" cy="369.656" r="3"/>
<circle cx="750.941" cy="520.115" r="3"/>
<circle cx="801.883" cy="590.230" r="3"/>
<circle cx="852.824" cy="660.344" r="3"/>
<circle cx="649.059" cy="520.115" r="3"/>
<circle cx="598.117" cy="590.230" r="3"/>
<circle cx="547.176" cy="660.344" r="3"/>
<circle cx="617.575" cy="423.219" r="3"/>
<circle cx="535.150" cy="396.437" r="3"/>
<circle cx="452.725" cy="369.656" r="3"/>
</g>
<g id="selected-grades" fill="#176373" stroke="#ffffff" stroke-width="3">
<circle id="significance-marker" cx="700" cy="450" r="9" visibility="hidden"/>
<circle id="knowledge-marker" cx="700" cy="450" r="9" visibility="hidden"/>
<circle id="understanding-marker" cx="700" cy="450" r="9" visibility="hidden"/>
<circle id="methods-marker" cx="700" cy="450" r="9" visibility="hidden"/>
<circle id="exposition-marker" cx="700" cy="450" r="9" visibility="hidden"/>
</g>
<g id="axis-labels">
<g id="significance-labels">
<text x="700" y="114" class="axis-name">Significance</text>
<text id="significance-grade" x="700" y="170" class="grade-name">Grade</text>
</g>
<g id="knowledge-labels">
<text x="1120" y="317" class="axis-name">Knowledge</text>
<text id="knowledge-grade" x="1120" y="373" class="grade-name">Grade</text>
</g>
<g id="understanding-labels">
<text x="990" y="757" class="axis-name">Understanding</text>
<text id="understanding-grade" x="990" y="813" class="grade-name">Grade</text>
</g>
<g id="methods-labels">
<text x="410" y="757" class="axis-name">Methods</text>
<text id="methods-grade" x="410" y="813" class="grade-name">Grade</text>
</g>
<g id="exposition-labels">
<text x="280" y="317" class="axis-name">Exposition</text>
<text id="exposition-grade" x="280" y="373" class="grade-name">Grade</text>
</g>
</g>
<text x="700" y="902" font-size="17">Lowest grade at the origin; three higher grades on successive rings.</text>
<text x="700" y="935" font-size="17">Grades are specific to each dimension; shaded area does not measure overall value.</text>
</svg>
